name: Validate and build packages

on:
  push:
    branches:
      - main
      - 'foundation/**'
      - 'feature/**'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: PHP syntax check
        run: find packages tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate theme JSON
        run: php -r '$json = file_get_contents("packages/itk-commerce-theme/theme.json"); json_decode($json, true, 512, JSON_THROW_ON_ERROR); echo "theme.json valid\n";'

      - name: Validate package compatibility manifests
        run: |
          php -r '$files=["packages/itk-commerce-theme/compatibility.json","packages/itk-commerce-core/compatibility.json"]; foreach($files as $file){$data=json_decode(file_get_contents($file),true,512,JSON_THROW_ON_ERROR); foreach(["schema_version","package","type","version","status","minimum","tested_up_to"] as $key){if(!array_key_exists($key,$data)){throw new RuntimeException("Missing {$key} in {$file}");}} echo "{$file} valid\n";}'

      - name: Core activation smoke test
        run: php tests/core/activation-smoke.php

      - name: Guard generic packages from reference-customer coupling
        run: |
          if grep -RniE 'Al-Lord|al-lord' packages; then
            echo 'Reference-customer name detected in generic packages.'
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build installable ZIP packages
        run: |
          mkdir -p dist
          cd packages
          zip -qr ../dist/itk-commerce-theme.zip itk-commerce-theme
          zip -qr ../dist/itk-commerce-core.zip itk-commerce-core

      - name: Upload development packages
        uses: actions/upload-artifact@v4
        with:
          name: itk-commerce-suite-dev-packages
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
