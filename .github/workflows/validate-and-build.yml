name: Validate and build packages

on:
  push:
    branches:
      - main
      - 'foundation/**'
      - 'feature/**'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: PHP syntax check
        run: find packages -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate theme JSON
        run: php -r '$json = file_get_contents("packages/itk-commerce-theme/theme.json"); json_decode($json, true, 512, JSON_THROW_ON_ERROR); echo "theme.json valid\n";'

  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build installable ZIP packages
        run: |
          mkdir -p dist
          cd packages
          zip -qr ../dist/itk-commerce-theme.zip itk-commerce-theme
          zip -qr ../dist/itk-commerce-core.zip itk-commerce-core

      - name: Upload development packages
        uses: actions/upload-artifact@v4
        with:
          name: itk-commerce-suite-dev-packages
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
