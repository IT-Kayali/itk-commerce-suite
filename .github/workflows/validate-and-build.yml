name: Validate and build packages

on:
  push:
    branches:
      - main
      - 'foundation/**'
      - 'feature/**'
      - 'agent/**'
      - 'fix/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: PHP syntax check
        run: find packages tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax check
        run: |
          node --check playwright.config.js
          find packages tests -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check

      - name: Validate theme JSON
        run: php -r '$json = file_get_contents("packages/itk-commerce-theme/theme.json"); json_decode($json, true, 512, JSON_THROW_ON_ERROR); echo "theme.json valid\n";'

      - name: Validate package compatibility manifests
        run: |
          php -r '$files=glob("packages/*/compatibility.json"); if(!$files){throw new RuntimeException("No compatibility manifests found");} foreach($files as $file){$data=json_decode(file_get_contents($file),true,512,JSON_THROW_ON_ERROR); foreach(["schema_version","package","type","version","status","minimum","tested_up_to"] as $key){if(!array_key_exists($key,$data)){throw new RuntimeException("Missing {$key} in {$file}");}} echo "{$file} valid\n";}'

      - name: Core activation smoke test
        run: php tests/core/activation-smoke.php

      - name: Core admin hub contract smoke test
        run: php tests/core/admin-hub-contract-smoke.php

      - name: Layouts module contract smoke test
        run: php tests/layouts/module-contract-smoke.php

      - name: Rich mega-menu normalization smoke test
        run: php tests/layouts/rich-mega-menu-smoke.php

      - name: Commerce template contract smoke test
        run: php tests/layouts/commerce-template-contract-smoke.php

      - name: Mini-cart contract smoke test
        run: php tests/layouts/mini-cart-contract-smoke.php

      - name: My Account contract smoke test
        run: php tests/layouts/account-contract-smoke.php

      - name: Public component extension contract smoke test
        run: php tests/layouts/component-extension-contract-smoke.php

      - name: Elementor Theme Builder contract smoke test
        run: php tests/layouts/elementor-theme-builder-smoke.php

      - name: Search Filter foundation smoke test
        run: php tests/search-filter/foundation-smoke.php

      - name: Search Filter UI contract smoke test
        run: php tests/search-filter/ui-contract-smoke.php

      - name: Search Filter async catalog contract smoke test
        run: php tests/search-filter/ajax-contract-smoke.php

      - name: Search Filter mobile drawer contract smoke test
        run: php tests/search-filter/mobile-drawer-contract-smoke.php

      - name: Search Filter live search contract smoke test
        run: php tests/search-filter/live-search-contract-smoke.php

      - name: Phase 6-7 module contract smoke test
        run: php tests/hardening/phase6-7-contract-smoke.php

      - name: Badges activation load-order smoke test
        run: php tests/hardening/badges-load-order-smoke.php

      - name: Code Manager parser and safety gates
        run: php tests/hardening/code-manager-validation-smoke.php

      - name: Phase 6-9 release contract smoke test
        run: php tests/hardening/release-contract-smoke.php

      - name: Customer/generic boundary smoke test
        run: php tests/hardening/customer-boundary-smoke.php

      - name: Guard generic packages from reference-customer coupling
        run: |
          if grep -RniE 'Al-Lord|al-lord' packages; then
            echo 'Reference-customer name detected in generic packages.'
            exit 1
          fi

      - name: Guard committed secrets
        run: |
          if grep -RniE --exclude='*.md' --exclude='*.json' --exclude='*.lock' '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|api[_-]?secret[[:space:]]*=[[:space:]]*[^$]|access[_-]?token[[:space:]]*=[[:space:]]*[^$]' packages client-profiles; then
            echo 'Potential committed secret detected.'
            exit 1
          fi

  browser-regression:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install browser test tooling
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install chromium
        timeout-minutes: 6

      - name: Responsive RTL accessibility browser regression
        run: npm run test:browser

      - name: Upload browser regression diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: itk-commerce-browser-regression-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs:
      - validate
      - browser-regression
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build installable ZIP packages
        run: |
          mkdir -p dist
          for package in packages/itk-commerce-*; do
            [ -d "$package" ] || continue
            name="$(basename "$package")"
            (cd packages && zip -qr "../dist/${name}.zip" "$name")
          done
          test -n "$(find dist -maxdepth 1 -name 'itk-commerce-*.zip' -print -quit)"

      - name: Upload development packages
        uses: actions/upload-artifact@v4
        with:
          name: itk-commerce-suite-dev-packages
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
